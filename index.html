<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeMahou — App Policies & Legal Documents</title>
  <style>
    :root {
      --primary: #0d9488;
      --primary-dark: #065f46;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff;
      padding: 44px 20px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; font-size: 30px; }
    header p { margin: 0; opacity: 0.92; font-size: 16px; }
    .container {
      max-width: 820px;
      margin: 32px auto;
      padding: 0 16px 48px;
    }
    .policy-list {
      display: grid;
      gap: 16px;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .policy-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 26px;
      text-decoration: none;
      color: var(--text);
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .policy-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: 0 8px 24px rgba(13, 148, 136, 0.12);
    }
    .policy-info h2 {
      margin: 0 0 4px;
      font-size: 20px;
      color: var(--primary-dark);
    }
    .policy-info p {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
    }
    .badge {
      display: inline-block;
      background: #ccfbf1;
      color: var(--primary-dark);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 24px;
    }
  </style>
</head>
<body>
  <header>
    <h1>CodeMahou — Public Policies</h1>
    <p>Official Privacy Policies &amp; Terms for CodeMahou Applications</p>
  </header>

  <main class="container">
    <ul class="policy-list">
      <!-- DoseMint Privacy Policy -->
      <li>
        <a class="policy-card" href="./dosemint_privacy_policy.html">
          <div class="policy-info">
            <h2>DoseMint (دوز مينت) — Privacy Policy | سياسة الخصوصية</h2>
            <p>Package: <code>com.codemahou.dosemint</code> • Updated: November 2026</p>
          </div>
          <span class="badge">View Policy &rarr;</span>
        </a>
      </li>

      <!-- Add future app policy cards here -->
    </ul>
  </main>

  <footer>
    &copy; 2026 CodeMahou. All rights reserved.
  </footer>
</body>
</html>
